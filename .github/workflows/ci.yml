name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # nx affected compares against the merge base, so it needs
          # enough history to find one.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PRs laufen affected (Merge-Base existiert). Pushes auf main
      # bauen alles — affected hat dort ohne Nx Cloud keine Basis.
      - name: Lint
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm exec nx affected --target=lint
          else
            pnpm exec nx run-many -t lint
          fi

      - name: Typecheck, test, build
        run: |
          for target in typecheck test build build-storybook test-storybook; do
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              pnpm exec nx affected --target=$target
            else
              pnpm exec nx run-many -t $target
            fi
          done

      - name: Bundle budget
        run: pnpm run size-check

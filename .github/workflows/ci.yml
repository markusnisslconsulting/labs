name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Commit before the changes whose API changelog should be checked
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      - name: Verify pull request changes
        if: github.event_name == 'pull_request'
        run: pnpm gates --affected
      # Main runs the full graph, including changes from cancelled or failed runs.
      - name: Verify the complete workspace
        if: github.event_name != 'pull_request'
        run: pnpm gates
      - name: Verify the tested release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm release:verify "$GITHUB_SHA"
      - name: Archive the tested release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tar -czf dist/labs-release.tar.gz -C dist/release manifest.json public
      - name: Retain the tested release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: labs-release-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/labs-release.tar.gz
          if-no-files-found: error
          retention-days: 30

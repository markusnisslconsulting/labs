name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # nx affected compares against the merge base, so it needs
          # enough history to find one.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Affected überall: PRs gegen die Merge-Base, Pushes auf main
      # gegen HEAD~1 (alles seit dem letzten Push). Beim ersten Commit
      # ohne Vorgänger fällt der Lauf auf das ganze Graph zurück.
      - name: Determine base
        id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "args=--base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "args=--base=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: pnpm exec nx affected --target=lint ${{ steps.base.outputs.args }}

      - name: Typecheck, test, build
        run: |
          for target in typecheck test build build-storybook test-storybook; do
            pnpm exec nx affected --target=$target ${{ steps.base.outputs.args }}
          done

      - name: Bundle budget
        run: pnpm run size-check

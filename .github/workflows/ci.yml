name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Three pushes in five minutes used to run three full pipelines to
# completion. Only the newest commit on a ref is worth testing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # nx affected compares against the merge base, so it needs
          # enough history to find one.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # One source of truth for the Node version. It used to be pinned
      # here as well as in engines and .nvmrc, which is two places to
      # forget.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nx caches by input hash, so a run that changed one component does
      # not rebuild the other three packages. Without this the cache lives
      # only inside a single run and every push starts cold.
      - name: Restore the Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Affected überall: PRs gegen die Merge-Base, Pushes auf main
      # gegen HEAD~1 (alles seit dem letzten Push). Beim ersten Commit
      # ohne Vorgänger fällt der Lauf auf das ganze Graph zurück.
      - name: Determine base
        id: base
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "args=--base=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "args=--base=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Formatting
        run: pnpm format:check

      # One invocation rather than a shell loop over targets. The loop
      # stopped at the first failure, so a lint error hid every test
      # result behind it and the next push found the next problem. Nx runs
      # these in dependency order, in parallel where it can, and reports
      # every failure from one run.
      - name: Gates
        run: >-
          pnpm exec nx affected
          --targets=lint,typecheck,test,build,build-storybook,test-storybook,browser-test,tokens-check,contrast-check,story-coverage,snapshot-budget,a11y
          ${{ steps.base.outputs.args }}

      - name: Bundle budget
        run: pnpm run size-check
        # Skript skippt sauber, wenn nichts gebaut wurde.

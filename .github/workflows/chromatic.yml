name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Snapshots are the unit of cost, and a superseded build's snapshots are
# wasted. Cancelling in progress is the single largest saving available.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Turbosnap (onlyChanged) braucht die volle Historie.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm exec nx run ui:build-storybook --skip-nx-cache

      # The CLI straight from the repo (18.x); the action bundles an
      # older version.
      #
      # On a pull request a visual change BLOCKS: --exit-zero-on-changes is
      # omitted, so the job is red until the diff is accepted in Chromatic.
      # That is the difference between a visual gate and a visual report.
      - name: Publish to Chromatic (gate)
        if: github.event_name == 'pull_request'
        run: pnpm exec chromatic --storybook-build-dir dist/packages/ui-storybook --only-changed
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      # On main the build only refreshes the baseline, so an accepted
      # change must not fail the deploy.
      - name: Publish to Chromatic (baseline)
        if: github.event_name != 'pull_request'
        run: pnpm exec chromatic --storybook-build-dir dist/packages/ui-storybook --only-changed --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

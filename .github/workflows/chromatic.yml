name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Turbosnap (onlyChanged) braucht die volle Historie.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm exec nx run ui:build-storybook --skip-nx-cache

      # Direktes CLI aus dem Repo (18.x) — die Action bundelt eine
      # aeltere Version.
      - name: Publish to Chromatic
        run: pnpm exec chromatic --storybook-build-dir dist/packages/ui-storybook --only-changed --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

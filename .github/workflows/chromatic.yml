name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Commit before the changes to compare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Is the design system affected?
        id: affected
        run: pnpm exec tsx tooling/checks/chromatic-affected.ts
      - name: Build Storybook
        if: steps.affected.outputs.run == 'true'
        run: pnpm exec nx run ui:build-storybook --skip-nx-cache
      - name: Publish to Chromatic (gate)
        if: steps.affected.outputs.run == 'true' && github.event_name == 'pull_request'
        run: pnpm exec chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      - name: Publish to Chromatic (baseline)
        if: steps.affected.outputs.run == 'true' && github.event_name != 'pull_request'
        run: pnpm exec chromatic --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

name: Deploy to Hetzner

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run whose retained release should be deployed or restored
        required: true
        type: string
      ci_attempt:
        description: Successful attempt number for that CI run
        required: true
        default: "1"
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup
        with:
          browser: "true"

      - name: Select a successful CI artifact
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_ATTEMPT: ${{ inputs.ci_attempt }}
        run: pnpm exec tsx tooling/release/select-ci-cli.ts

      - name: Download the tested artifact
        if: steps.release.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.release.outputs.artifact_id }}
          run-id: ${{ steps.release.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/incoming
          digest-mismatch: error

      - name: Extract and verify the exact release
        if: steps.release.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        run: pnpm exec tsx tooling/release/extract-cli.ts

      - name: Publish over FTPS and verify in the browser
        if: steps.release.outputs.deploy == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        run: pnpm exec tsx tooling/release/deploy-cli.ts

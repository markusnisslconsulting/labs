name: Propose a component
description: A short RFC before any code exists. Five questions, not a formality.
title: "RFC: <component name>"
labels: ["rfc", "component"]
body:
  - type: markdown
    attributes:
      value: |
        The purpose of this form is to force the two answers that build a
        component into a system rather than alongside it: who else needs it,
        and what it replaces.

        A component exactly one product needs belongs in that product. That
        is not a refusal, it is the right address — and the way back is open
        as soon as a second product wants it.
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves, from the point of view of the person at the screen
      description: >-
        Not the technical gap. The task that is hard today.
      placeholder: >-
        A buyer has to find one supplier out of 4000 and only knows part of
        the name.
    validations:
      required: true
  - type: textarea
    id: who-else
    attributes:
      label: Who else needs it
      description: >-
        By name: which second product, which team. "Probably everyone" is not
        an answer — and if there is only one, say so; then the answer to this
        RFC is probably "build it in your product for now".
    validations:
      required: true
  - type: textarea
    id: replaces
    attributes:
      label: What it replaces
      description: >-
        Which local re-implementation, which pattern, which combination of
        existing components disappears because of it. If nothing disappears,
        the system has only grown.
    validations:
      required: true
  - type: textarea
    id: not-existing
    attributes:
      label: Why no existing component
      description: >-
        Read `packages/ui/inventory.json` or Storybook and name the closest
        one. Every component there says for itself when to reach for
        something else — refute that sentence.
    validations:
      required: true
  - type: textarea
    id: axes
    attributes:
      label: Axes rather than variants
      description: >-
        Which props generalise (`variant`, `tone`, `size`)? A one-off prop
        like `isCheckoutStyle` is a sign the component is still carrying a
        product detail.
    validations:
      required: false
  - type: checkboxes
    id: bar
    attributes:
      label: The bar, before it becomes stable
      description: >-
        None of this has to be met at RFC time. It is here so that nobody
        meets it later as a surprise.
      options:
        - label: >-
            States complete in one photographed matrix story
            (`ui:story-coverage`, `ui:snapshot-budget`)
        - label: >-
            Keyboard contract in `src/keyboard.map.ts`, one test per row
        - label: >-
            Semantic or component tokens only, no primitive values
        - label: >-
            No built-in strings; everything through `useStrings()`
        - label: >-
            A row in `src/audit/screen-readers.ts` with the reason its
            announcement is worth checking
        - label: >-
            A line in the inventory, meaning "use it for" and "reach for
            something else when" are written

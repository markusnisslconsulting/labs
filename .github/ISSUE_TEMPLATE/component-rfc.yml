name: Komponente vorschlagen
description: Kurzes RFC, bevor Code entsteht. Fuenf Fragen, keine Formalie.
title: "RFC: <Komponentenname>"
labels: ["rfc", "component"]
body:
  - type: markdown
    attributes:
      value: |
        Der Zweck dieses Formulars ist, die zwei Antworten zu erzwingen, die
        eine Komponente in ein System hinein statt daran vorbei bauen: wer sie
        sonst noch braucht, und was sie ersetzt.

        Eine Komponente, die genau ein Produkt braucht, gehoert in dieses
        Produkt. Das ist keine Absage, es ist die richtige Adresse — und der
        Weg zurueck ist offen, sobald ein zweites Produkt sie will.
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem loest sie, aus Sicht der Person am Bildschirm
      description: >-
        Nicht die technische Luecke. Die Aufgabe, die heute schwer ist.
      placeholder: >-
        Ein Einkaeufer muss aus 4000 Lieferanten einen finden und kennt nur
        einen Teil des Namens.
    validations:
      required: true
  - type: textarea
    id: who-else
    attributes:
      label: Wer braucht sie sonst
      description: >-
        Namentlich: welches zweite Produkt, welches Team. "Vermutlich alle"
        ist keine Antwort — und wenn es nur eines gibt, sag das; dann ist die
        Antwort auf dieses RFC vermutlich "baut sie erst mal bei euch".
    validations:
      required: true
  - type: textarea
    id: replaces
    attributes:
      label: Was sie ersetzt
      description: >-
        Welcher lokale Nachbau, welches Muster, welche Kombination
        existierender Komponenten verschwindet dadurch. Wenn nichts
        verschwindet, waechst das System nur.
    validations:
      required: true
  - type: textarea
    id: not-existing
    attributes:
      label: Warum keine existierende Komponente
      description: >-
        Lies `packages/ui/inventory.json` oder Storybook und nenne die
        naechstliegende. Jede Komponente dort sagt selbst, wann man zu
        etwas anderem greifen soll — widerlege den Satz.
    validations:
      required: true
  - type: textarea
    id: axes
    attributes:
      label: Achsen statt Varianten
      description: >-
        Welche Props generalisieren (`variant`, `tone`, `size`)? Ein
        Einzelfall-Prop wie `isCheckoutStyle` ist ein Hinweis darauf, dass
        die Komponente noch ein Produkt-Detail traegt.
    validations:
      required: false
  - type: checkboxes
    id: bar
    attributes:
      label: Die Latte, bevor sie stable wird
      description: >-
        Nichts davon muss beim RFC erfuellt sein. Es steht hier, damit
        niemand es spaeter als Ueberraschung erlebt.
      options:
        - label: >-
            Zustaende vollstaendig in einer fotografierten Matrix-Story
            (`ui:story-coverage`, `ui:snapshot-budget`)
        - label: >-
            Tastaturvertrag in `src/keyboard.map.ts`, ein Test pro Zeile
        - label: >-
            Nur semantic- oder component-Tokens, keine primitiven Werte
        - label: >-
            Keine eingebauten Strings; alles ueber `useStrings()`
        - label: >-
            Zeile in `src/audit/screen-readers.ts` mit dem Grund, warum ihre
            Ansage eine Pruefung wert ist
        - label: >-
            Eine Zeile im Inventar, also "use it for" und "reach for
            something else when" geschrieben

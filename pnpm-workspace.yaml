packages:
  - apps/*
  - packages/*
  - tooling/*
  - tooling/fixtures/*
  - tests/*

# Nx pins versions affected by parser and expansion denial-of-service advisories.
overrides:
  "nx@23.1.1>brace-expansion": 5.0.12
  "nx@23.1.1>smol-toml": 1.7.1

# Native build helpers allowed during dependency installation.
allowBuilds:
  nx: true
  esbuild: true
  playwright: true
  "@swc/core": true
  unrs-resolver: true
